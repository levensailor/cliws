name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_new_instance:
        description: Terminate and recreate the EC2 instance
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EC2_INSTANCE_TYPE: ${{ vars.EC2_INSTANCE_TYPE || 't3.micro' }}
  EC2_INSTANCE_NAME: ${{ vars.EC2_INSTANCE_NAME || 'cliws' }}
  EC2_KEY_NAME: ${{ vars.EC2_KEY_NAME }}
  EC2_FORCE_NEW_INSTANCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_new_instance || vars.EC2_FORCE_NEW_INSTANCE || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY || vars.EC2_SSH_PRIVATE_KEY }}
        run: |
          missing=0
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "::error::Missing AWS_ACCESS_KEY_ID. Add it to the 'main' environment (secret or variable) or repository secrets."
            missing=1
          fi
          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "::error::Missing AWS_SECRET_ACCESS_KEY. Add it to the 'main' environment (secret or variable) or repository secrets."
            missing=1
          fi
          if [ -z "${EC2_KEY_NAME}" ]; then
            echo "::error::Missing EC2_KEY_NAME repository variable."
            missing=1
          fi
          if [ -z "${EC2_SSH_PRIVATE_KEY}" ]; then
            echo "::error::Missing EC2_SSH_PRIVATE_KEY. Add it to the 'main' environment or repository secrets."
            missing=1
          fi
          exit "${missing}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Provision EC2 instance
        id: provision
        run: |
          chmod +x deploy/*.sh
          ./deploy/ec2-provision.sh

      - name: Configure SSH key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY || vars.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${EC2_SSH_PRIVATE_KEY}" > ~/.ssh/cliws_ec2_key
          chmod 600 ~/.ssh/cliws_ec2_key

      - name: Deploy application to EC2
        id: deploy
        env:
          EC2_PUBLIC_IP: ${{ steps.provision.outputs.public_ip }}
          EC2_SSH_KEY_PATH: ~/.ssh/cliws_ec2_key
        run: ./deploy/ec2-deploy.sh "${EC2_PUBLIC_IP}"

      - name: Deployment summary
        run: |
          {
            echo "## CLIWS EC2 deployment"
            echo ""
            echo "- Instance ID: \`${{ steps.provision.outputs.instance_id }}\`"
            echo "- Public IP: \`${{ steps.provision.outputs.public_ip }}\`"
            echo "- App URL: ${{ steps.deploy.outputs.app_url }}"
            echo "- Region: \`${{ env.AWS_REGION }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
